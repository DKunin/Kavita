services:
  kavita:
    image: ${KAVITA_IMAGE:-kavita-kunini:local}
    container_name: kavita
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./config:/kavita/config
      - /mnt/data/plex/books:/books:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
